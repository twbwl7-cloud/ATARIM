<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 40" fill="none">
  <defs>
    <linearGradient id="dt-gold" x1="0" y1="0" x2="56" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C5A059"/>
      <stop offset="1" stop-color="#E8D399"/>
    </linearGradient>
  </defs>
  <!-- Perfect grid: stroke = 5. Shared top y=5 and bottom y=35 for D and T. -->
  <!-- D -->
  <rect x="2" y="5" width="5" height="30" fill="url(#dt-gold)"/>
  <rect x="2" y="5" width="20" height="5" fill="url(#dt-gold)"/>
  <rect x="17" y="5" width="5" height="30" fill="url(#dt-gold)"/>
  <rect x="2" y="30" width="20" height="5" fill="url(#dt-gold)"/>
  <!-- T — same top/bottom rails, optically centered stem -->
  <rect x="28" y="5" width="26" height="5" fill="url(#dt-gold)"/>
  <rect x="38.5" y="5" width="5" height="30" fill="url(#dt-gold)"/>
</svg>
